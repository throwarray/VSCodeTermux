# Tuned for building on RAM-constrained ARM hardware (e.g. a ~1-1.5GB Fire
# Stick), whether that's inside this project's own Alpine guest, in a
# separate real Termux install, or anywhere else memory is tight enough
# that the kernel OOM killer (not just Android's app-level LMK — a JVM
# genuinely running out of physical memory gets killed regardless of
# foreground/background status) takes out the build mid-compile.

systemProp.java.net.preferIPv4Stack=true

# Mandatory for any project using AndroidX artifacts (this one does
# throughout) — without it Gradle resolves against the old pre-AndroidX
# support-library namespace instead and every androidx.* import fails.
android.useAndroidX=true

# AGP normally fetches its own aapt2 binary from Google's Maven, built for
# desktop Linux/macOS/Windows — that binary doesn't run in a Termux guest,
# so self-hosting a build of this app from within its own environment
# needs this pointed at the real, working, pkg-installed aapt2 instead.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

org.gradle.user.home=./app/.gradle
org.gradle.daemon=false
# SerialGC over the default G1: G1's region bookkeeping overhead isn't
# worth it below ~2GB heaps, and Serial's simplicity means less non-heap
# JVM memory spent managing the collector itself.
# org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -Dos.arch=x86_64

org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false

# The big one for Kotlin specifically: by default the Kotlin compiler runs
# in its own persistent daemon process — a SECOND JVM, with its own heap,
# running concurrently with Gradle's. That second JVM is very often what
# actually exhausts memory on a constrained device, independent of how
# tightly org.gradle.jvmargs above is capped. in-process folds compilation
# into Gradle's own JVM instead — one heap to budget, not two. Costs some
# speed on incremental rebuilds; worth it here.

kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
